name = "discord-4id"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 1分ごとにスキャン（無料プランでOK）。SCAN_MODE="external" にすると Worker 側のスキャンは止まる
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "discord-4id"
database_id = "8e599b34-1a73-40db-a1a6-db57f0e36ad0"

[vars]
# スキャン対象の文字数（同じ周回数なら先に書いた方を優先。3文字は54,872通りと母数が少ないので先に狙う）
SCAN_LENGTHS = "3,4"
# Discord ユーザー名で使える文字（英小文字・数字・_ ・.）
CHARSET = "abcdefghijklmnopqrstuvwxyz0123456789_."
# 1回の cron で確認する件数（無料プランのサブリクエスト上限 50 未満にする）
SCAN_BATCH = "20"
# リクエスト間の待ち時間(ms)
SCAN_DELAY_MS = "700"
# リストの仕分け: 「使える」を再確認する間隔(時間)
RECHECK_HOURS = "6"
# リストの仕分け: 「使えない」を再確認する間隔(時間)（空き直すことがあるので）
TAKEN_RECHECK_HOURS = "72"
# "worker" = Cloudflare の cron でスキャン / "external" = GitHub Actions などからスキャン
SCAN_MODE = "external"  # Cloudflare からの確認は Discord に 403 で拒否されたため GitHub Actions でスキャン

# シークレット（wrangler secret put で設定）:
#   DISCORD_PUBLIC_KEY   … Developer Portal の Public Key
#   DISCORD_APPLICATION_ID … Application ID
#   SCAN_SECRET          … 外部スキャナー用の合言葉（external モードを使う場合のみ）
