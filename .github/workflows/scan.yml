# 外部スキャナー（任意）
# Cloudflare Workers から Discord へのリクエストがブロックされる場合や、
# もっと速く回したい場合に、GitHub Actions の IP からスキャンする。
# 優先順位: GATEWAY_SCAN=true（有料ローテーティング住宅プロキシ） > PROXY_SCAN=true（無料プロキシ） > 単一IP
# Secrets に SCAN_SECRET を設定すると動く（止めたいときは Variables に SCANNER_ENABLED=false）
name: scan
on:
  schedule:
    - cron: '0 * * * *'  # 1時間ごとに起動し、各回 約55分スキャン（concurrency で重複しない）
  workflow_dispatch:
    inputs:
      proxy_scan:
        description: 'true で無料プロキシ並列スキャナーを使う（未指定なら Variables の PROXY_SCAN に従う）'
        required: false
        type: string
      gateway_scan:
        description: 'true で有料ローテーティング住宅プロキシ(ゲートウェイ)を使う（未指定なら Variables の GATEWAY_SCAN に従う）'
        required: false
        type: string
      duration_sec:
        description: '実行時間（秒）。手動テスト用に短くできる'
        required: false
        type: string
      candidate_limit:
        description: 'proxy-scan: 検証キューに入れる候補数上限。未指定/0なら全件（約55万件）。手動テスト用に小さくできる'
        required: false
        type: string
      gateway_concurrency:
        description: 'gateway-scan: 同時セッション数。課金があるので手動テストでは小さくする'
        required: false
        type: string
      gateway_requests_per_session:
        description: 'gateway-scan: 1セッションあたりの上限リクエスト数。手動テストでは小さくする'
        required: false
        type: string
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    if: vars.SCANNER_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: scan
        run: |
          if [ -z "$SCAN_SECRET" ]; then echo 'SCAN_SECRET が未設定なのでスキップ'; exit 0; fi
          if [ "$GATEWAY_SCAN" = "true" ]; then
            if [ -z "$GATEWAY_LOGIN" ] || [ -z "$GATEWAY_PASSWORD" ]; then echo 'GATEWAY_LOGIN/GATEWAY_PASSWORD が未設定なのでスキップ'; exit 0; fi
            node scripts/gateway-scan.js
          elif [ "$PROXY_SCAN" = "true" ]; then
            node scripts/proxy-scan.js
          else
            node scripts/external-scan.js
          fi
        env:
          WORKER_URL: ${{ vars.WORKER_URL || 'https://discord-4id.c53gftun651-tiktok.workers.dev' }}
          SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
          SCAN_DURATION_SEC: ${{ inputs.duration_sec || '3300' }}
          PROXY_SCAN: ${{ inputs.proxy_scan || vars.PROXY_SCAN }}
          PROXY_MAX_WORKERS: ${{ vars.PROXY_MAX_WORKERS }}
          PROXY_VALIDATE_CONCURRENCY: ${{ vars.PROXY_VALIDATE_CONCURRENCY }}
          PROXY_CANDIDATE_LIMIT: ${{ inputs.candidate_limit || vars.PROXY_CANDIDATE_LIMIT }}
          GATEWAY_SCAN: ${{ inputs.gateway_scan || vars.GATEWAY_SCAN }}
          GATEWAY_HOST: ${{ vars.GATEWAY_HOST }}
          GATEWAY_PORT: ${{ vars.GATEWAY_PORT }}
          GATEWAY_LOGIN: ${{ secrets.GATEWAY_LOGIN }}
          GATEWAY_PASSWORD: ${{ secrets.GATEWAY_PASSWORD }}
          GATEWAY_CONCURRENCY: ${{ inputs.gateway_concurrency || vars.GATEWAY_CONCURRENCY }}
          GATEWAY_REQUESTS_PER_SESSION: ${{ inputs.gateway_requests_per_session || vars.GATEWAY_REQUESTS_PER_SESSION }}
