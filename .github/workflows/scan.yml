# 外部スキャナー（任意）
# Cloudflare Workers から Discord へのリクエストがブロックされる場合や、
# もっと速く回したい場合に、GitHub Actions の IP からスキャンする。
# PROXY_SCAN=true（vars）なら、無料プロキシを並列で使って1本のIPより速く撃つ proxy-scan.js を使う。
# Secrets に SCAN_SECRET を設定すると動く（止めたいときは Variables に SCANNER_ENABLED=false）
name: scan
on:
  schedule:
    - cron: '0 * * * *'  # 1時間ごとに起動し、各回 約55分スキャン（concurrency で重複しない）
  workflow_dispatch:
    inputs:
      proxy_scan:
        description: 'true でプロキシ並列スキャナーを使う（未指定なら Variables の PROXY_SCAN に従う）'
        required: false
        type: string
      duration_sec:
        description: '実行時間（秒）。手動テスト用に短くできる'
        required: false
        type: string
      candidate_limit:
        description: 'proxy-scan: 検証キューに入れる候補数上限。未指定/0なら全件（約55万件）。手動テスト用に小さくできる'
        required: false
        type: string
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    if: vars.SCANNER_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: scan
        run: |
          if [ -z "$SCAN_SECRET" ]; then echo 'SCAN_SECRET が未設定なのでスキップ'; exit 0; fi
          if [ "$PROXY_SCAN" = "true" ]; then
            node scripts/proxy-scan.js
          else
            node scripts/external-scan.js
          fi
        env:
          WORKER_URL: ${{ vars.WORKER_URL || 'https://discord-4id.c53gftun651-tiktok.workers.dev' }}
          SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
          SCAN_DURATION_SEC: ${{ inputs.duration_sec || '3300' }}
          PROXY_SCAN: ${{ inputs.proxy_scan || vars.PROXY_SCAN }}
          PROXY_MAX_WORKERS: ${{ vars.PROXY_MAX_WORKERS }}
          PROXY_VALIDATE_CONCURRENCY: ${{ vars.PROXY_VALIDATE_CONCURRENCY }}
          PROXY_CANDIDATE_LIMIT: ${{ inputs.candidate_limit || vars.PROXY_CANDIDATE_LIMIT }}
